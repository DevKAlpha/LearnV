server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # The full policy travels in each page's <meta> (hash-pinned inline scripts, see scripts/csp.mjs).
  # Headers add what a meta tag cannot express.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Enable only behind HTTPS (e.g. a TLS-terminating proxy):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # HTML and data must revalidate so a new deploy is picked up immediately.
  location ~* \.(?:html|json)$ {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri /index.html;
  }

  # Vite's hashed output never changes; files in public/ (illustrations, data) are not hashed.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
