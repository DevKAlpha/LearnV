name: Deploy LearnV to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [Validate learning QA]
    branches: [qa]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: qa
          path: .qa-source
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .qa-source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate architecture
        run: pnpm run check:architecture
      - name: Run automated tests
        run: pnpm test
      - name: Refresh official GKS radar
        run: pnpm gks:update
      - name: Build production bundle
        run: pnpm build
        env:
          VITE_APP_SCOPE: full
      - name: Install QA dependencies
        working-directory: .qa-source
        run: pnpm install --frozen-lockfile
      - name: Validate latest QA candidate
        working-directory: .qa-source
        run: pnpm run check:architecture && pnpm test && pnpm run build:qa
        env:
          VITE_APP_SCOPE: learning-qa
      - name: Assemble production and isolated QA preview
        run: node scripts/assemble-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
