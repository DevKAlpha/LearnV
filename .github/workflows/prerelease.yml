name: Build LearnV prerelease

on:
  push:
    branches: [prerelease]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Validate pre-release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate architecture, tests and production build
        run: pnpm validate
      - name: Store testable pre-release bundle
        uses: actions/upload-artifact@v4
        with:
          name: learnv-prerelease-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
