name: Validate learning QA

on:
  push:
    branches: [qa]
  pull_request:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:architecture
      - run: pnpm test
      - name: Build restricted learning app
        run: pnpm run build:qa
      - name: Keep testable QA bundle without deploying production
        uses: actions/upload-artifact@v4
        with:
          name: learnv-learning-qa-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - name: Verify full app remains buildable
        run: pnpm exec vite build --mode full --outDir dist-full-validation
