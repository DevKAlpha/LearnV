<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e5" />
    <script>
      (() => {
        const saved = localStorage.getItem("learnv-theme-v1");
        const theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.classList.add("app-visual-loading");
      })();
    </script>
    <style>
      #learnv-bootstrap-loader{position:fixed;z-index:519;inset:0;display:grid;place-items:center;min-height:100vh;min-height:100dvh;background:#f8eee8;color:#241a24;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
      [data-theme="dark"] #learnv-bootstrap-loader{background:#181219;color:#fff8f2}
      .learnv-bootstrap-scene{display:grid;width:120px;place-items:center;gap:4px}
      .learnv-bootstrap-scene svg{width:72px;height:82px;animation:learnv-bootstrap-tulip 1.8s ease-in-out infinite;filter:drop-shadow(3px 4px 0 rgba(43,24,48,.22))}
      .learnv-bootstrap-books{display:grid;width:108px;gap:3px;margin-top:-5px}
      .learnv-bootstrap-books i{display:block;height:12px;border:1.5px solid #241a24;border-radius:4px 9px 9px 4px}
      .learnv-bootstrap-books i:nth-child(1){width:88px;justify-self:center;background:#ffbd20}.learnv-bootstrap-books i:nth-child(2){width:108px;background:#ec2745}.learnv-bootstrap-books i:nth-child(3){width:96px;justify-self:end;background:#c3a1dc}
      .learnv-bootstrap-scene strong{margin-top:8px;font-size:13px;letter-spacing:.03em}
      @keyframes learnv-bootstrap-tulip{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-4px) rotate(2.5deg)}}
      @media(prefers-reduced-motion:reduce){.learnv-bootstrap-scene svg{animation:none}}
    </style>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="description"
      content="LearnV: preparación guiada, verificable y móvil para la beca Global Korea Scholarship."
    />
    <title>LearnV - Nuestra Ruta a Corea</title>
  </head>
  <body>
    <div id="learnv-bootstrap-loader" role="status" aria-label="Cargando LearnV">
      <div class="learnv-bootstrap-scene" aria-hidden="true">
        <svg viewBox="0 0 72 82" fill="none"><path d="M35 48v29" stroke="#557645" stroke-width="5" stroke-linecap="round"/><path d="M34 65c-10-7-18-4-22 4 9 4 17 3 22-4Z" fill="#78965a" stroke="#2d3927" stroke-width="2"/><path d="M38 59c8-7 15-6 20 0-7 5-14 5-20 0Z" fill="#91aa6e" stroke="#2d3927" stroke-width="2"/><path d="M36 52C21 52 10 41 11 25c8 1 15 5 20 12-1-11 1-21 5-31 5 10 7 20 5 31 5-7 12-11 20-12 1 16-10 27-25 27Z" fill="#b86bd2" stroke="#2b1830" stroke-width="2.6" stroke-linejoin="round"/><path d="M36 52c-9-3-14-11-13-25 6 4 10 9 13 17 3-8 7-13 13-17 1 14-4 22-13 25Z" fill="#a85bc5" fill-opacity=".58" stroke="#2b1830" stroke-width="1.8"/></svg>
        <div class="learnv-bootstrap-books"><i></i><i></i><i></i></div>
        <strong>LearnV</strong>
      </div>
    </div>
    <script>
      (() => {
        const locale = localStorage.getItem("learnv-locale-v1");
        const labels = { es: "Cargando LearnV", en: "Loading LearnV", ko: "LearnV 불러오는 중" };
        const activeLocale = locale === "en" || locale === "ko" ? locale : "es";
        document.documentElement.lang = activeLocale;
        document.getElementById("learnv-bootstrap-loader")?.setAttribute("aria-label", labels[activeLocale]);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
